<!DOCTYPE html>
<html lang="en">
<head>
    {{ template "head" . }}
</head>
<body>
    {{ template "header" . }}
    {{ template "navbar" . }}

    <div class="d-flex justify-content-center">
        <div class="bg-pink rounded-55 px-5 py-4 text-center">
          <span class="text-white font-size-96 portfolio-subtitle">Place an order</span>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 11">
        <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    ✓ Form submitted successfully! Please check your email.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <form id="orderForm" action="/order" method="POST" enctype="multipart/form-data">
        <div class="d-flex justify-content-center align-items-center">
            <div class="card p-4" style="width: 320px;">
                <div class="mb-3">
                    <label class="form-label text-r">Email</label>
                    <input type="email" name="email" class="form-control input-text" placeholder="user@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-y">Description</label>
                    <textarea class="form-control input-text" name="description" rows="4" placeholder="Write down your thoughts..." required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label text-main">References (max 5MB)</label>
                    <input type="file" name="references" accept="image/*" class="form-control" id="fileInput" multiple>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" name="marketingConsent" type="checkbox" id="agreeCheck">
                    <label class="form-check-label text-g" for="agreeCheck">
                        I agree to receive marketing emails
                    </label>
                </div>

                <button class="btn btn-pink text-white w-100" type="submit">Submit</button>
            </div>
        </div>
    </form>

    {{ template "navbar" . }}

  {{ template "footer" . }}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    const form = document.getElementById("orderForm");
    const submitButton = form.querySelector('button[type="submit"]');
    
    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        
        // Disable submit button and show loading state
        submitButton.disabled = true;
        const originalText = submitButton.textContent;
        submitButton.textContent = "Submitting...";
        
        const formData = new FormData(form);
        
        try {
            const response = await fetch("/order", {
                method: "POST",
                body: formData
            });
            
            if (response.ok) {
                console.log("Form submitted successfully!");
                
                // Show success toast
                const toastElement = document.getElementById('successToast');
                const toast = new bootstrap.Toast(toastElement, {
                    autohide: true,
                    delay: 5000 // 5 seconds
                });
                toast.show();
                
                // Reset form
                form.reset();
                
            } else {
                console.error("Failed to submit form");
                alert("Failed to submit form. Please try again.");
            }
        } catch (err) {
            console.error("Error submitting form:", err);
            alert("Error submitting form. Please try again.");
        } finally {
            // Re-enable submit button
            submitButton.disabled = false;
            submitButton.textContent = originalText;
        }
    });
</script>
</body>
</html>
