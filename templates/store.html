<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="image/x-icon" href="/assets-compressed/B-logo1.png" />
    <link rel="stylesheet" href="/assets-compressed/style.css">
</head>
<body>
    {{ template "header" . }}
    {{ template "navbar" . }}

    <div class="d-flex justify-content-center">
        <div class="bg-pink rounded-55 px-5 py-4 text-center">
          <span class="text-white font-size-96 portfolio-subtitle">Place an order</span>
        </div>
    </div>

    <form id="orderForm" action="/order" method="POST" enctype="multipart/form-data">
        <div class="d-flex justify-content-center align-items-center">
            <div class="card p-4" style="width: 320px;">
                <div class="mb-3">
                    <label class="form-label text-r">Email</label>
                    <input type="email" name="email" class="form-control input-text" placeholder="user@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-y">Description</label>
                    <textarea class="form-control input-text" name="description" rows="4" placeholder="Write down your thoughts..." required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label text-main">References (max 5MB)</label>
                    <input type="file" name="references" accept="image/*" class="form-control" id="fileInput" multiple>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" name="marketingConsent" type="checkbox" id="agreeCheck">
                    <label class="form-check-label text-g" for="agreeCheck">
                        I agree to receive marketing emails
                    </label>
                </div>

                <button class="btn btn-pink text-white w-100" type="submit">Submit</button>
            </div>
        </div>
    </form>

    {{ template "navbar" . }}

  {{ template "footer" . }}

<script>
        const form = document.getElementById("orderForm");

        form.addEventListener("submit", async function(e) {
            e.preventDefault(); // Prevent page reload or navigation
            const formData = new FormData(form); // automatically includes files and inputs

            for (const [key, value] of formData.entries()) {
            // For files, value is a File object
                console.log(`${key}: ${value}\n`)
            }


            try {
                const response = await fetch("/order", {
                method: "POST",
                body: formData
                });

                if (response.ok) {
                console.log("Form submitted successfully!");
                console.log(formData)
                    // Here is where you can show the toast later
                } else {
                    console.error("Failed to submit form");
                }
            } catch (err) {
                console.error("Error submitting form:", err);
            }
        });
</script>
</body>
</html>
